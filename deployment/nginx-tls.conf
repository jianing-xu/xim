# Included inside nginx's http block. Replace domain, certificate and static paths.
map $http_upgrade $xim_connection_upgrade { default upgrade; '' close; }
limit_conn_zone $binary_remote_addr zone=xim_clients:10m;
limit_req_zone $binary_remote_addr zone=xim_http:10m rate=10r/s;
server {
    listen 80;
    server_name chat.example.com;
    return 308 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name chat.example.com;
    ssl_certificate /etc/letsencrypt/live/chat.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chat.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /opt/xim/frontend;
    index index.html;
    client_max_body_size 64k;
    client_header_timeout 10s;
    limit_conn xim_clients 20;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    location / { try_files $uri $uri/ /index.html; }
    location = /ws {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $xim_connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }
    location /api/ {
        limit_req zone=xim_http burst=20 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $http_host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        add_header Cache-Control no-store always;
    }
}
